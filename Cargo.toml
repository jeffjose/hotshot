[package]
name = "hotshot"
version = "0.2.0"
edition = "2021"
description = "An extremely fast screenshot and annotation tool"
license = "MIT"

[dependencies]
x11rb = { version = "0.14", features = ["shm", "randr", "cursor", "composite"] }
fontdue = "0.9"
png = "0.18"
ttf-parser = "0.25"
zune-jpeg = "0.4"
libc = "0.2"
rayon = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Drawing in an unoptimized build is unusably slow.
[profile.dev.package."*"]
opt-level = 3
