[package]
name = "hotshot"
version = "0.2.0"
edition = "2021"
description = "An extremely fast screenshot and annotation tool"
license = "MIT"

[dependencies]
x11rb = { version = "0.14", features = ["shm", "randr", "cursor", "composite", "xfixes", "xinput"] }
fontdue = "0.9"
png = "0.18"
ttf-parser = "0.25"
# Fills the outlines of the layers Twemoji is made of.
ab_glyph_rasterizer = "0.1"
zune-jpeg = "0.4"
libc = "0.2"
rayon = "1"
jpeg-encoder = "0.7.1"
image-webp = "0.2.4"

[build-dependencies]
vergen-gitcl = "10.0.3"

# No cross-crate LTO and 16 codegen units, Cargo's own default, as jog
# has: a rebuild of hotshot takes 4 s rather than 20 s (fat LTO with one
# unit, a single core for all of it), and the binary is 0.4 MB larger.
# Measured 2026-10-19, --benchmark five times each way in turn on a
# 1080p screen: no difference in drawing beyond noise.
[profile.release]
opt-level = 3
panic = "abort"
# Symbols kept, for a crash to say where it was in crash.log.
strip = "debuginfo"

# Drawing in an unoptimized build is unusably slow.
[profile.dev.package."*"]
opt-level = 3
