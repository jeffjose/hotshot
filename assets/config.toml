# hotshot's settings. This file goes at ~/.config/hotshot/config.toml:
#
#     hotshot --default-config > ~/.config/hotshot/config.toml
#
# Every line here is commented out, and says what hotshot does anyway.
# Options on the command line override what is set here.

# The folder Save puts pictures in.
# dir = "~/Pictures/Screenshots"

# What a saved picture is called, less the .png: the time, set out as
# strftime does.
# filename = "screenshot-%Y-%m-%d-%H%M%S"

# What Enter, and a double click inside the selection, do with the
# picture: "copy" it to the clipboard, "save" it to the folder, "both",
# or "pin" it to the screen.
# enter = "copy"

# The color of the selection's edge and of what is picked out in the bar.
# accent = "indigo"
#   a Radix color by name:
#   tomato red ruby crimson pink plum purple violet iris indigo blue cyan
#   teal jade green grass orange brown bronze gold
#   or any color as "RRGGBB", such as "3E63DD"

# The color drawn in to begin with.
# color = "red"
#   any of the color box's, which are Radix's:
#   tomato red ruby crimson pink plum purple violet iris indigo blue cyan
#   teal jade green grass lime yellow amber orange brown gray white black
#   or any color as "RRGGBB"

# The width of line drawn with to begin with, and the size of text that
# goes with it: 1 (thin) to 4 (heavy).
# size = 2

# How round the corners of a rectangle are, in pixels of a screen 1080
# high; 0 for square ones.
# corner-radius = 6

# How much darker what is not selected is made, as a percentage.
# dim = 50

# Round the corners of the picture itself by this many pixels (of a
# screen 1080 high), leaving what is outside them see-through. The dot
# inside a corner of the selection, or K, changes it for the picture
# being taken. (border-radius is another name for it.)
# rounded = 0

# Before anything is selected, the whole screen is dark, and the window
# under the pointer, which a click would take, has a line round it:
# "outline". With "bright" that window shows undarkened instead, which
# where one window fills the screen is the screen left bright until an
# area is dragged out. With "off" windows are not shown or taken at all.
# windows = "outline"

# A magnifier that follows the pointer while an edge of the selection is
# being placed, for placing it to the pixel.
# magnifier = false

# The face text is typed in to begin with: "geist" (or "sans"),
# "instrument-serif" ("serif"), "architects-daughter" ("hand"),
# "fira-code" ("mono") or "anton" ("impact"). G goes from each to the
# next.
# font = "geist"

# Other folders Save can save to, as well as dir: as many of these
# lines as there are folders. The arrow beside Save lists them, and the
# one chosen is the one Save saves to from then on.
# place = "~/Pictures/work"
# place = "~/Documents/bugs"

# The picture set in a frame every time: on a backdrop, with room round
# it (0 to 3, or a number of pixels), and a shadow. Without these it is
# plain, and a frame is something chosen for one picture with W.
#   the backdrops, as the box of them has them:
#   meshes: aurora orchid ember lagoon nebula peacock rosewood midnight
#           sorbet candy glacier meadow sunrise citrus dune pearl
#   lines:  dusk ocean sunset mint peach violet iris arctic grape
#           flamingo lime rose sky steel slate paper
#   plain:  white fog sand blush navy forest graphite ink
#   or "photo" (the one photo = names), "random" (a photograph nobody
#   chose), or "none", which with a shadow is a shadow on nothing.
#   Padding is the same all round, or beside and above/below as "80x40".
# backdrop = "none"
# padding = 0
# frame-radius = 0
# The shadow: false, true (which is Tailwind's 2xl), one of Tailwind's
# sizes ("2xs", "xs", "sm", "md", "lg", "xl", "2xl"), or CSS's
# box-shadow, in quotes, as "0 10px 15px -3px rgb(0 0 0 / 0.1)".
# shadow = false
# A window round the picture, inside the frame: "browser", "mac",
# "terminal", "desktop" or "none". Its bar is dark over a dark picture.
# window-frame = "none"

# How things are drawn to begin with: how opaque, in percent; lines and
# arrows in dashes; which ends of an arrow have heads ("end", "start",
# "both"); a zoom "round" or "square"; and the tool in hand ("move",
# "arrow", "line", "rect", "oval", "pen", "marker", "text", "counter",
# "blur", "spotlight", "zoom").
# opacity = 100
# dashed = false
# arrow-heads = "end"
# zoom = "round"
# tool = "move"

# A picture of your own to set pictures on, a PNG or a JPEG: the box of
# backdrops has a button for it when this is set.
# photo = "~/Pictures/backdrop.jpg"

# Rectangles and ovals filled to begin with; what with, if not the color
# above; and whether with a border too, which unless this says otherwise
# they have only when they are not filled.
# filled = false
# fill-color = "yellow"
# border = true

# The color, width of line, roundness of corners, fill and font in hand
# when hotshot is closed are the ones in hand when it is next opened.
# With false, it begins every time with what this file says.
# remember = true

# Seconds to wait before the screen is frozen: time to open a menu.
# delay = 0

# What kind of file a picture is saved as: "png", "jpg" or "webp". A
# name given with -o that ends in one of them says so itself. What goes
# to the clipboard is a PNG whichever.
# format = "png"

# How good a JPEG is, 1 to 100.
# quality = 90

# The mouse pointer in the picture, where it was when the screen was
# frozen. Either way, the button for it in the bar, or M, puts it in
# and takes it out for the picture being taken.
# pointer = false

# Keep the area dragged out to a shape, so wide to so tall ("16:9"), or
# to a size in pixels ("1280x720"), which a press puts down and a drag
# moves. Without either, Shift held keeps an area square as it is
# dragged out, and the shape it has as it is resized.
# aspect = "free"
# fixed = "free"

# A recording (hotshot --record, or the button for it): what kind of
# file it is, "mp4", "gif", "apng" or "webp"; how many frames a second;
# whether the mouse pointer is in it; and whether the keys pressed are
# said along its bottom, as subtitles are. It is ffmpeg that records.
# record-format = "mp4"
# fps = 60
# record-pointer = true
# keys = false

# Sizes of frames of your own for the canvas, as many lines as you like,
# each "Name = WIDTHxHEIGHT"; they are listed under Yours in the frame's
# sizes, and "Save W × H as a size" there adds a line here.
# frame-size = "Pixel 11 = 1080x2424"
